name: Build offline classroom

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'refresh.html'
      - 'app.js'
      - 'apps.json'
      - 'style.css'
      - 'taxonomy.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'offline.html'
      - 'offline.js'
      - 'offline.css'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/build-offline.yml'
  schedule:
    # Sunday 03:00 Taiwan time; updated lesson repositories are mirrored weekly.
    - cron: '0 19 * * 6'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Assemble public lesson websites (static copies)
        run: python3 scripts/build_offline.py --output ./_site
      - name: Report size before deploy
        run: |
          du -sh ./_site
          python3 - <<'PY'
          import os
          total=sum(os.path.getsize(os.path.join(root,f)) for root,_,files in os.walk('_site') for f in files)
          print(f'Total size: {total/1e6:.1f} MB')
          if total > 950_000_000:
              raise SystemExit('超過 GitHub Pages 建議站台大小，請把大型模型分離處理')
          PY
      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
