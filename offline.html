<!doctype html>
<html lang="zh-Hant">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#faf8fc">
 <title>離線教材｜剛剛の數位小教室</title>
 <link rel="stylesheet" href="./offline.css">
 <link rel="icon" href="./assets/app-icon-192.png">
 <script src="./offline.js" defer></script>
</head>
<body>
 <main class="page">
  <header class="topbar">
   <a class="back" href="./" aria-label="返回小教室">‹</a>
   <h1>離線教材</h1>
   <span class="counter" id="counter">讀取中</span>
  </header>
  <div class="actions">
    <button id="download-all" class="primary" disabled>↓ 下載全部</button>
    <button id="check-all" class="light">↻ 檢查</button>
  </div>
  <div class="progress" id="progress-area" hidden>
    <div class="progress-head"><span id="progress-text">準備下載</span><strong id="progress-percent">0%</strong></div>
    <progress id="progress-bar" value="0" max="100"></progress>
  </div>
  <p id="hint" class="hint">已下載代表檔案已快取；仍需關閉 Wi-Fi 實測各項功能。</p>
  <div id="list" class="list" aria-live="polite"><p class="hint">正在讀取教材清單…</p></div>
  <details class="help"><summary>使用說明</summary>
    <p>請先連上 Wi-Fi，依序為每台 iPad 下載教材。檔案會存入目前瀏覽器或主畫面 App 的儲存空間。下載期間不要關閉畫面。</p>
    <p>狀態「已快取」只代表列出的靜態檔案都在本機，不保證外部 CDN、遠端 API、動態內容與 3D 模型已完整支援離線。</p>
    <p>教材修改後，先重新整理此頁，再點「下載更新」。新版本完整下載前會保留舊版，不會提前切換。</p>
  </details>
  <p class="error" id="error" role="status"></p>
 </main>
</body>
</html>
