<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9fc">
  <meta name="description" content="剛剛數位小教室：國中生物互動教學入口">
  <title>剛剛數位小教室</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./hub-v4.css">
  <script src="./hub-v4.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">✦</span>
        <h1>剛剛數位小教室</h1>
      </div>
      <button class="status-summary" id="status-summary" type="button" aria-label="查看離線準備情況">
        <span class="status-dot" id="status-dot"></span><span id="status-summary-text">檢查離線狀態</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </header>
    <section class="section-heading" id="section-heading" aria-live="polite">
      <h2 id="section-title">選擇單元</h2>
      <span id="section-count" class="section-count">9 個主題</span>
    </section>
    <section class="grid" id="grid" aria-label="教學單元">
      <p class="loading">正在載入單元…</p>
    </section>
    <footer class="footer">
      <div class="legend"><span><i class="dot green"></i>已驗證</span><span><i class="dot amber"></i>已快取・待測試</span><span><i class="dot gray"></i>尚未確認</span></div>
      <p>點選後使用原本網站完整畫面；請使用 Safari 上一頁返回。</p>
    </footer>
  </main>
  <dialog id="offline-dialog" class="offline-dialog" aria-labelledby="offline-title">
    <div class="dialog-head"><h2 id="offline-title">離線準備檢查</h2><button class="close" id="close-dialog" type="button" aria-label="關閉">✕</button></div>
    <p class="dialog-info">這裡檢查的是<strong>目前這台 iPad</strong>。綠色狀態須先關閉 Wi-Fi、成功操作過該單元，再手動確認；系統也會檢查是否仍有必要的快取。單純連上 Wi-Fi 不代表離線可用。</p>
    <div id="offline-list" class="offline-list"></div>
    <div class="dialog-foot"><button id="refresh-status" type="button">重新檢查</button><button id="dialog-done" type="button">完成</button></div>
  </dialog>
</body>
</html>
