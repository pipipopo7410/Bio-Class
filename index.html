<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f8fb">
  <meta name="description" content="剛剛數位小教室｜國中生物互動學習工具入口">
  <title>剛剛數位小教室</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5 2.5 2.5 0 0 1 6.5 15H20"/><path d="M9 8h6M12 5v6"/></svg>
        </div>
        <h1>剛剛數位小教室</h1>
      </div>
      <div class="header-controls">
        <div class="summary" id="summary" role="status" aria-live="polite">
          <span class="summary-light" aria-hidden="true"></span>
          <span id="summary-text">正在檢查離線狀態</span>
        </div>
        <button class="check-button" id="prepare" type="button" hidden title="預先下載已整合的本機工具所需資源">預載工具</button>
        <button class="check-button" id="recheck" type="button" title="重新檢查本機快取中的教學工具" aria-label="重新檢查離線狀態">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-4M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 4M20 20v-5h-5"/></svg>
          <span>重新檢查</span>
        </button>
      </div>
    </header>

    <section id="grid" class="grid" aria-label="教學單元">
      <p class="loading">載入教學單元中…</p>
    </section>

    <footer class="footer">
      <div class="legend" aria-label="離線狀態說明">
        <span class="legend-item"><span class="small-dot green"></span>離線可用</span>
        <span class="legend-item"><span class="small-dot orange"></span>尚未預載／待驗證</span>
        <span class="legend-item"><span class="small-dot gray"></span>需連線</span>
      </div>
      <p id="note">點選單元後會直接進入原網站；請使用 Safari 上一頁返回。</p>
    </footer>
  </main>
</body>
</html>
