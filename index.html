<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf7fb"><meta name="description" content="剛剛の數位小教室｜國中生物互動教學入口網站">
  <title>剛剛の數位小教室</title>
  <link rel="icon" href="./assets/app-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/app-icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="identity">
        <img class="app-mark" src="./assets/app-icon-192.png" alt="剛剛の數位小教室 App Icon">
        <div class="title-wrap">
          <h1>剛剛<span class="no">の</span>數位小教室</h1>
          <div class="logo-cluster" aria-label="品牌標誌">
            <div class="logo-dot"><img src="./assets/logo-mark-black.png" alt="剛字品牌標誌"></div>
            <div class="logo-card"><img src="./assets/logo-turtle.png" alt="烏龜品牌標誌"></div>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <a class="icon-btn" href="./offline.html" title="離線教材" aria-label="離線教材"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M4 17v3h16v-3"/></svg></a>
        <button class="install-button" id="install-help" type="button" aria-haspopup="dialog" aria-controls="install-dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M12 7v9m-3-3 3 3 3-3"/></svg><span>安裝教學</span></button>
      </div>
    </header>
    <div class="section-bar" id="section-bar" hidden><button class="back-button" id="back-button" type="button" aria-label="返回首頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"/></svg></button><h2 id="section-name"></h2></div>
    <main id="grid" class="grid" aria-label="教學網站選單"><p class="loading">正在載入…</p></main>
    <section class="meta-panel"><div>目前入口：9 個主題／12 個正式網站</div><div>之後若新增單元，只需調整 <code>assets/apps.json</code></div></section>
  </div>
  <dialog class="dialog" id="install-dialog" aria-labelledby="install-title"><div class="dialog-body"><div class="dialog-top"><h2 id="install-title">安裝到 iPad</h2><button id="close-install" class="dialog-close" type="button" aria-label="關閉">✕</button></div><ol class="steps"><li><span class="step-number">1</span><span>用 <strong>Safari</strong> 開啟本網站</span></li><li><span class="step-number">2</span><span>點下方 <strong>分享</strong> 鍵</span></li><li><span class="step-number">3</span><span>選擇 <strong>加入主畫面</strong></span></li><li><span class="step-number">4</span><span>之後可直接從 iPad 主畫面開啟</span></li></ol><p class="install-note">這一版先更新入口網站視覺與品牌。離線教材下載功能請等你下一輪測試時再驗收。</p><button id="done-install" class="dialog-done" type="button">知道了</button></div></dialog>
</body></html>
