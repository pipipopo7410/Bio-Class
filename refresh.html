<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>更新入口網站快取｜剛剛の數位小教室</title><style>body{font-family:system-ui,"PingFang TC",sans-serif;background:#f9f6fb;color:#364560;min-height:100dvh;display:grid;place-items:center;margin:0;padding:20px}.panel{max-width:540px;background:#fff;border:1px solid #ece1ef;border-radius:25px;padding:32px;box-shadow:0 15px 45px #77678820}h1{margin:0 0 15px;font-size:1.6rem}p{line-height:1.75}button{border:0;border-radius:14px;padding:15px 23px;background:#7769ac;color:white;font-size:1rem;font-weight:bold;cursor:pointer}#msg{font-size:.95rem;color:#5c6984}</style></head><body><div class="panel"><h1>已找到新版更新工具</h1><p>如果首頁一直顯示舊畫面，可以只清除「入口網站外殼」的快取，讓頁面重新載入。已下載的教材快取與離線進度不會主動刪除。</p><button id="fix" type="button">更新入口網站畫面</button><p id="msg" aria-live="polite"></p></div><script>document.getElementById('fix').onclick=async()=>{const msg=document.getElementById('msg');msg.textContent='正在清除舊版首頁快取…';try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(r.scope.includes('/biology-hub/'))await r.unregister();}}if('caches' in window){for(const key of await caches.keys()){if(key.startsWith('gg-room-shell-')||key.startsWith('gg-classroom-v'))await caches.delete(key);}}msg.textContent='完成，即將開啟新版首頁。';location.replace('./index.html?refresh=521');}catch(e){msg.textContent='自動更新失敗，請用 Safari 清除本網站資料後重新開啟。'+e.message;}};</script></body></html>
