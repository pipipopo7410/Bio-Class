<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>分類｜剛剛の數位小教室</title><style>html,body{margin:0;width:100%;height:100%;background:#141a23}iframe{display:block;border:0;width:100%;height:100vh;height:100dvh}.fallback{position:fixed;inset:auto 12px 12px auto;background:rgba(255,255,255,.9);padding:10px 14px;border-radius:14px;font:14px/1.4 system-ui,sans-serif;color:#40506f}</style></head><body><iframe id="frame" title="分類網站" src="https://pipipopo7410.github.io/Taxonomy-Key/"></iframe><div class="fallback">若分頁未自動切換，請直接使用原網站上方分頁列。</div><script>const stage=Number(new URLSearchParams(location.search).get('stage')||1);const frame=document.getElementById('frame');frame.addEventListener('load',()=>{try{const doc=frame.contentWindow.document;const btn=doc.querySelector(`.tab-btn[data-src="stage${stage}.html"]`);if(btn) btn.click();}catch(e){console.warn('無法自動切換分類分頁',e);}});</script></body></html>
