<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>分類｜剛剛の數位小教室</title>
  <style>
    html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#1a252f}
    iframe{display:block;border:0;width:100%;height:100%;height:100dvh}
    .fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#1a252f;color:white;font:16px -apple-system,sans-serif}
  </style>
</head>
<body>
  <iframe id="taxonomy-frame" title="分類四階段特訓"  allow="fullscreen"></iframe>
  <div class="fallback" id="fallback">載入分類網站中…</div>
  <script>
    (()=>{
      'use strict';
      const stage=Number(new URLSearchParams(location.search).get('stage'));
      const target=Number.isInteger(stage)&&stage>=1&&stage<=4?stage:1;
      const frame=document.getElementById('taxonomy-frame');
      const original='https://pipipopo7410.github.io/Taxonomy-Key/';
      const local=new URLSearchParams(location.search).get('local')==='1';
      frame.src=local?'./apps/taxonomy/index.html':original;
      let located=false;
      // 15 秒仍未成功定位時回到原網站，避免慢網路或 iframe 限制導致空白。
      if(!local)setTimeout(()=>{if(!located)location.replace(original);},15000);
      // 此入口與原網站都位於 pipipopo7410.github.io，因此可選擇原本的分頁，
      // 保留原網站頂部的四階段切換列，且不額外增加任何高度。
      frame.addEventListener('load',()=>{
        try{
          const doc=frame.contentWindow.document;
          const btn=doc.querySelector(`.tab-btn[data-src="stage${target}.html"]`);
          if(btn){btn.click();located=true;return;}
        }catch(err){console.warn('分類分頁無法自動定位',err);}
        // 若使用 file:// 預覽或網站限制嵌入，直接開啟原網站，避免空白頁。
        if(!local&&location.origin!==new URL(original).origin){location.replace(original);}
      });
    })();
  </script>
</body>
</html>
